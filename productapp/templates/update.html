{% extends "index.html" %}

{% block content %}

<main class="page-wrapper">

    <section class="container">

        <p class="eyebrow">
            PRODUCT MANAGEMENT
        </p>


        <h1>
            Update Product
        </h1>


        <p class="subtitle">
            Update the product details below.
        </p>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    name="productName"
                    value="{{ product.productName }}"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <!-- CATEGORY + BRAND -->

            <div class="row">

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>


                        <option
                            value="electronics"
                            {% if product.category == "electronics" %}selected{% endif %}
                        >
                            Electronics
                        </option>


                        <option
                            value="clothing"
                            {% if product.category == "clothing" %}selected{% endif %}
                        >
                            Clothing
                        </option>


                        <option
                            value="food"
                            {% if product.category == "food" %}selected{% endif %}
                        >
                            Food
                        </option>


                        <option
                            value="furniture"
                            {% if product.category == "furniture" %}selected{% endif %}
                        >
                            Furniture
                        </option>


                        <option
                            value="books"
                            {% if product.category == "books" %}selected{% endif %}
                        >
                            Books
                        </option>


                        <option
                            value="other"
                            {% if product.category == "other" %}selected{% endif %}
                        >
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="brand">
                        Brand
                    </label>

                    <input
                        type="text"
                        id="brand"
                        name="brand"
                        value="{{ product.brand }}"
                        placeholder="Enter brand name"
                        required
                    >

                </div>

            </div>


            <!-- PRICE + QUANTITY -->

            <div class="row">

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        value="{{ product.price }}"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        value="{{ product.quantity }}"
                        min="1"
                        required
                    >

                </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Product Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    required
                >{{ product.description }}</textarea>

            </div>


            <!-- DATE + IMAGE -->

            <div class="row">

                <div class="form-group">

                    <label for="date">
                        Manufacture Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        value="{{ product.date|date:'Y-m-d' }}"
                    >

                </div>


                <div class="form-group">

                    <label for="image">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/*"
                    >


                    {% if product.image %}

                    <div class="current-image">

                        <p>
                            Current Image:
                        </p>

                        <img
                            src="{{ product.image.url }}"
                            alt="{{ product.productName }}"
                            width="100"
                            height="100"
                            style="
                                object-fit: cover;
                                border-radius: 10px;
                            "
                        >

                        <br>

                        <small>
                            {{ product.image.name }}
                        </small>

                    </div>

                    {% endif %}

                </div>

            </div>


            <!-- AVAILABILITY -->

            <div class="form-group">

                <label>
                    Product Availability
                </label>


                <div class="radio-group">

                    <label class="radio-option">

                        <input
                            type="radio"
                            name="availability"
                            value="available"
                            {% if product.availability %}checked{% endif %}
                            required
                        >

                        <span>
                            Available
                        </span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="availability"
                            value="out-of-stock"
                            {% if not product.availability %}checked{% endif %}
                        >

                        <span>
                            Out of Stock
                        </span>

                    </label>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Update Product
                </button>


                <a
                    href="{% url 'list' %}"
                    class="button reset-btn"
                >
                    Cancel
                </a>

            </div>

        </form>


        <p class="form-footer">

            <a
                href="{% url 'list' %}"
                class="back-link"
            >
                ← Back to Product List
            </a>

        </p>

    </section>

</main>

{% endblock %}
