{% extends "index.html" %}

{% block content %}

<main class="page-wrapper">

    <section class="container">

        <p class="eyebrow">
            PRODUCT MANAGEMENT
        </p>


        <h1>
            Product Registration
        </h1>


        <p class="subtitle">
            Enter the product details below.
        </p>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    name="productName"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <!-- CATEGORY + BRAND -->

            <div class="row">

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="clothing">
                            Clothing
                        </option>

                        <option value="food">
                            Food
                        </option>

                        <option value="furniture">
                            Furniture
                        </option>

                        <option value="books">
                            Books
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="brand">
                        Brand
                    </label>

                    <input
                        type="text"
                        id="brand"
                        name="brand"
                        placeholder="Enter brand name"
                        required
                    >

                </div>

            </div>


            <!-- PRICE + QUANTITY -->

            <div class="row">

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="₹ Enter price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        placeholder="Enter quantity"
                        min="1"
                        required
                    >

                </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Product Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter product description"
                    required
                ></textarea>

            </div>


            <!-- DATE + IMAGE -->

            <div class="row">

                <div class="form-group">

                    <label for="date">
                        Manufacture Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                    >

                </div>


                <div class="form-group">

                    <label for="image">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/*"
                    >

                </div>

            </div>


            <!-- AVAILABILITY -->

            <div class="form-group">

                <label>
                    Product Availability
                </label>


                <div class="radio-group">

                    <label class="radio-option">

                        <input
                            type="radio"
                            name="availability"
                            value="available"
                            required
                        >

                        <span>
                            Available
                        </span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="availability"
                            value="out-of-stock"
                        >

                        <span>
                            Out of Stock
                        </span>

                    </label>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Register Product
                </button>


                <a
                    href="{% url 'list' %}"
                    class="button reset-btn"
                >
                    Cancel
                </a>

            </div>

        </form>


        <p class="form-footer">

            <a
                href="{% url 'index' %}"
                class="back-link"
            >
                ← Back to Home
            </a>

        </p>

    </section>

</main>

{% endblock %}
